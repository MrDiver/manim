[package]
name = "manim-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "The native part of manim, imported in Python as manim._native."

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
glam = "0.34.1"
numpy = "0.30.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
