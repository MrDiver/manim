[project]
name = "manimx"
version = "0.1.0"
description = "Small, test-first animation engine prototype."
requires-python = ">=3.11"
dependencies = [
    "mapbox-earcut>=2.1.0",
    "numpy>=2.4.6",
    "numpy-quaternion>=2024.0.0",
    "pillow>=11.0",
    "pygltflib>=1.16.5",
    "questionary>=2.1",
    "rich>=13.9",
    "skia-pathops>=0.8",
    "typer>=0.15",
    "typing-extensions>=4.16.0",
    "typst>=0.14",
    "wgpu>=0.32.0",
]

[project.scripts]
manimx = "manimx.cli:run"

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.1",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
# Mixed project: the Python package manimx plus the Rust core (core/,
# see CORE.md) as the extension module manimx._core.
python-source = "."
module-name = "manimx._core"
manifest-path = "core/Cargo.toml"
features = ["pyo3/extension-module"]

[dependency-groups]
test = [
    "mutmut>=3.4.0",
    "pytest>=8.3.0",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=6.0.0",
]

[tool.uv]
default-groups = ["test"]
# Rebuild the core when its sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "core/Cargo.toml" }, { file = "core/src/**/*.rs" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=manimx",
    "--cov-branch",
    "--cov-fail-under=90",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["manimx"]
omit = []

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
source_paths = ["manimx/"]
do_not_mutate = []
pytest_add_cli_args = ["--no-cov"]
pytest_add_cli_args_test_selection = ["tests/"]
