<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>manimx preview</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1 id="title">manimx</h1>
    <output id="time" aria-live="off">0.00 s</output>
  </header>
  <main>
    <pre id="problem" role="alert" hidden></pre>
    <figure id="stage">
      <img id="frame" alt="The frame at the current time">
      <figcaption id="error" hidden></figcaption>
    </figure>
    <section id="timeline" aria-label="Timeline" tabindex="0">
      <div id="ruler"></div>
      <div id="clips"></div>
      <div id="playhead"></div>
    </section>
    <p class="hint">Drag on the timeline to scrub. ← → one frame, Shift+← → one second, Home and End.</p>
  </main>
</body>
</html>
