<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>manimx preview</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1 id="title">manimx</h1>
    <output id="time" aria-live="off">0.00 s</output>
  </header>
  <main>
    <pre id="problem" role="alert" hidden></pre>
    <figure id="stage">
      <img id="frame" alt="The frame at the current time">
      <figcaption id="error" hidden></figcaption>
    </figure>
    <section id="timeline" aria-label="Timeline" tabindex="0">
      <div class="row ruler-row">
        <div class="label"><button id="collapse" type="button" title="Collapse every track">Collapse all</button></div>
        <div class="lane" id="ruler"></div>
      </div>
      <div id="rows" role="tree" aria-label="Clips, nodes, signals and animations"></div>
      <div id="overlay"><div id="playhead"></div></div>
    </section>
    <p class="hint">Drag on the tracks to scrub. ← → one frame, Shift+← → one second, Home and End. Click a name to open its tracks.</p>
  </main>
</body>
</html>
