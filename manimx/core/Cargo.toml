[package]
name = "manimx-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "The native core of manimx: evaluates scene plans and packs GPU records."

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
numpy = "0.29"

[profile.release]
debug = 1
