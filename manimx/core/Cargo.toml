[package]
name = "manimx-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "The native core of manimx: evaluates scene plans and packs GPU records."

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
numpy = "0.29"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "30"
pollster = "1"
earcutr = "0.5.0"

[profile.release]
debug = 1
